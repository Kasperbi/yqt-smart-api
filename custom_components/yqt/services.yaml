set_dnd_schedule:
  name: Set Do Not Disturb schedule
  description: >-
    Write the watch's Do Not Disturb schedule. Traced from APK analysis only
    and not yet confirmed against a live device -- see REVERSE_ENGINEERING.md
    and https://github.com/Niek/yqt-smart-api/issues/13. Only works for
    current-generation (DC == 2) watches. Omit "periods" entirely to
    clear/disable the schedule.
  target:
    device:
      integration: yqt
  fields:
    periods:
      name: Periods
      description: >-
        Up to 4 schedule windows, each as "START-END:DAYS", e.g.
        "22:00-07:00:mon,tue,wed,thu,fri". Times are HH:mm in 24-hour format;
        DAYS is a comma-separated list from sun,mon,tue,wed,thu,fri,sat.
      example: '["22:00-07:00:mon,tue,wed,thu,fri"]'
      required: false
      selector:
        object:
